name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported (pyproject's requires-python) and the dev version.
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev,web]"
      - run: pytest
      # A 100,000-recipient campaign's pages, each within its time budget.
      - run: pytest -m perf

  # Browser tests (pytest -m e2e): the dashboard in Google Chrome, which
  # GitHub's Ubuntu runners have installed; Playwright drives it.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -e ".[dev,web,e2e]"
      - run: pytest -m e2e
