# Local run of the dashboard (Phase 3):  docker compose up --build
#
# Reachable only from this machine, unless BIND_ADDR (in .env) is set to its
# NetBird IP — then colleagues on NetBird can open http://<that IP>:8000.
# NetBird's access policies decide who reaches it; the app still requires a
# login. The campaign DBs in ./data are shared with the CLI.
#
# Sandbox (nothing is sent; Kavenegar and Shlink are simulated): put
# SMS_SENDER_SANDBOX=1 in .env. Both services read it, and everything then
# lives in ./data/sandbox.
#
# Deploying it for real (backups, TLS, health, upgrades): docs/deploy.md.

# The logs carry phone numbers: keep them small and short-lived.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  web:
    build: .
    # IMAGE_TAG (in .env): build and run a tagged image, e.g. the git commit,
    # so an upgrade can be rolled back to the previous one.
    image: sms-sender-dashboard:${IMAGE_TAG:-latest}
    env_file: .env
    environment:
      SMS_SENDER_DATA_DIR: /app/data
      # The host's proxy settings, if any, pass through to Kavenegar / Shlink.
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      HTTP_PROXY: ${HTTP_PROXY:-}
      NO_PROXY: ${NO_PROXY:-}
    volumes:
      - ./data:/app/data
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${WEB_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging: *logging
    restart: unless-stopped

  # Runs the jobs the dashboard queues (sends, reconciliation, delivery and
  # click updates), one at a time. Exactly one worker.
  worker:
    image: sms-sender-dashboard:${IMAGE_TAG:-latest}
    command: ["python", "manage.py", "run_worker"]
    env_file: .env
    environment:
      SMS_SENDER_DATA_DIR: /app/data
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      HTTP_PROXY: ${HTTP_PROXY:-}
      NO_PROXY: ${NO_PROXY:-}
    volumes:
      - ./data:/app/data
    depends_on:
      web:
        condition: service_healthy  # web has run the migrations
    # On stop, a running send takes no new recipient and lets requests in
    # flight finish; the job is queued again for the next start. Anything
    # still in flight when the time runs out is reconciled, never resent.
    stop_grace_period: 90s
    # Alive: the worker on this container wrote its heartbeat within a
    # minute. Docker only reports it; a monitor has to act on "unhealthy".
    healthcheck:
      test: ["CMD", "python", "manage.py", "worker_status"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 60s
    logging: *logging
    restart: unless-stopped
