[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sms-sender"
version = "0.1.0"
description = "Reliable bulk SMS sender for Kavenegar verify/lookup, with resume + progress + retries."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "kifpool.me" }]
dependencies = [
    "kavenegar>=1.1.2",
    "click>=8.1",
    "tenacity>=8.2",
    "tqdm>=4.66",
    "python-dotenv>=1.0",
    "tomli>=2.0; python_version < '3.11'",
    "questionary>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
]
# The Persian dashboard (Phase 3). Its tests need it too:
# pip install -e ".[dev,web]"
web = [
    "django>=5.2,<5.3",
    "jdatetime>=5.0",
    "whitenoise>=6.7",
    "gunicorn>=23",
    "django-otp>=1.5",
    "segno>=1.6",
    "pytest-django>=4.9",
]
# Browser tests (pytest -m e2e). They drive the installed Google Chrome.
e2e = [
    "playwright>=1.47",
]

[project.scripts]
sms-sender = "sms_sender.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sms_sender_web = [
    "templates/**/*",
    "accounts/templates/**/*",
    "api/templates/**/*",
    "audit/templates/**/*",
    "campaigns/templates/**/*",
    "reports/templates/**/*",
    "dashboard/templates/**/*",
    "segments/templates/**/*",
    "suppression/templates/**/*",
    "static/**/*",
    "locale/**/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Browser tests are opt-in: pytest -m e2e
addopts = "-q -m 'not e2e'"
markers = [
    "e2e: browser tests in Google Chrome; need the e2e extra (pytest -m e2e)",
]
# Used by pytest-django (the `web` extra); without it the dashboard tests skip.
DJANGO_SETTINGS_MODULE = "sms_sender_web.settings_test"
filterwarnings = [
    "ignore:Unknown config option. DJANGO_SETTINGS_MODULE:pytest.PytestConfigWarning",
]
