[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sms-sender"
version = "0.1.0"
description = "Reliable bulk SMS sender for Kavenegar verify/lookup, with resume + progress + retries."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "kifpool.me" }]
dependencies = [
    "kavenegar>=1.1.2",
    "click>=8.1",
    "tenacity>=8.2",
    "tqdm>=4.66",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
]

[project.scripts]
sms-sender = "sms_sender.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
